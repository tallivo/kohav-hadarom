<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>כוכב הדרום</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#FAF9F6}</style>
<script>
/* GitHub Pages fallback: unknown path → site root, mapping /kohav-hadarom/place/x/ → /kohav-hadarom/#/place/x */
(function(){
  var root='/kohav-hadarom/';
  var rest=location.pathname.indexOf(root)===0?location.pathname.slice(root.length).replace(/\/+$/,''):'';
  location.replace(root+(rest?'#/'+rest:location.hash));
})();
</script></html>
